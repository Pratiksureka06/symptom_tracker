<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Shield / Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#medGrad)" filter="url(#shadow)"/>
  <!-- Inner Glow Ring -->
  <rect x="48" y="48" width="416" height="416" rx="96" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" fill="none" />
  <!-- Medical Cross Base -->
  <path d="M256 128 V384 M128 256 H384" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-opacity="0.25"/>
  <!-- Dynamic Pulse Line -->
  <path d="M96 256 H180 L210 180 L256 332 L302 210 L332 256 H416" stroke="url(#pulseGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
